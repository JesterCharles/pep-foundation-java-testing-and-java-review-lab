# Exa grading manifest for this Java lab: best-effort first version, not yet
# verified inside Exa Studio. It follows the observed Exa schema (everything
# under 'test:') and is meant to drive both local Run Tests and grading.
#
# ASSUMPTION: no 'image' is declared, so Exa's documented fallback to the
# project's pinned runtime pack applies. The imported Exa Java template must
# supply JDK 25, Apache Maven 3.9 and this lab's Maven dependencies already
# available offline: the command runs Maven offline (-o) and there is no
# 'setup' step, so nothing is downloaded at test time.
#
# The command runs from the repository root. Surefire writes one JUnit XML
# report per test class under starter/target/surefire-reports/. Build and test
# errors stay visible: quiet mode (-q) prints only problems.
test:
  command: "mvn -q -B -o -f starter/pom.xml test"
  reports: "starter/target/surefire-reports/*.xml"
